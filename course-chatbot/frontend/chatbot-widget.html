<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Materials Chatbot</title>
    <style>
        /* Chatbot Container */
        #chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* Floating Button */
        #chatbot-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066cc, #004d99);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #chatbot-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.6);
        }

        #chatbot-button svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* Chat Window */
        #chatbot-window {
            display: none;
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        #chatbot-window.active {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        #chatbot-header {
            background: linear-gradient(135deg, #0066cc, #004d99);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chatbot-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        #chatbot-header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            opacity: 0.9;
        }

        #close-button {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #close-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Messages Area */
        #chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        /* Message Bubbles */
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message.user {
            align-items: flex-end;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .message.user .message-content {
            background: #0066cc;
            color: white;
        }

        /* Suggestions List */
        .suggestions-list {
            margin-top: 12px;
            background: white;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .suggestion-item {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            font-size: 13px;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .suggestion-details {
            color: #666;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .suggestion-link {
            color: #0066cc;
            text-decoration: none;
            font-size: 12px;
        }

        .suggestion-link:hover {
            text-decoration: underline;
        }

        .section-header {
            font-weight: 600;
            color: #0066cc;
            margin-top: 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .section-header:first-child {
            margin-top: 0;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Input Area */
        #chatbot-input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
        }

        #chatbot-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        #chatbot-input:focus {
            border-color: #0066cc;
        }

        #send-button {
            padding: 12px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        #send-button:hover {
            background: #0052a3;
        }

        #send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Scrollbar Styling */
        #chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        #chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #chatbot-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        #chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Chatbot Container -->
    <div id="chatbot-container">
        <!-- Floating Button -->
        <button id="chatbot-button" aria-label="Open chatbot">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                <path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
            </svg>
        </button>

        <!-- Chat Window -->
        <div id="chatbot-window">
            <!-- Header -->
            <div id="chatbot-header">
                <div>
                    <h3>Course Assistant</h3>
                    <p>Textbook & Platform Suggestions</p>
                </div>
                <button id="close-button" aria-label="Close chatbot">×</button>
            </div>

            <!-- Messages -->
            <div id="chatbot-messages">
                <div class="message bot">
                    <div class="message-content">
                        Hi! I'm here to help you find textbook and assignment platform options based on what other professors have used. Just type in your course name to get started!
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div id="chatbot-input-area">
                <input 
                    type="text" 
                    id="chatbot-input" 
                    placeholder="Type your course name..."
                    aria-label="Message input"
                />
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
